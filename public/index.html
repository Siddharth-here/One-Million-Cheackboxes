<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-million-checkboxes</title>
    <style>
      :root {
          color-scheme: dark;
          --ink: #11151a;
          --panel: rgba(29, 35, 42, 0.88);
          --panel-border: rgba(255, 255, 255, 0.12);
          --text: #f7f3ea;
          --accent: #ff715b;
          --accent-light: #ffd166;
        }

        * {
          box-sizing: border-box;
        }

        body {
          min-height: 100vh;
          margin: 0;
          padding: clamp(2rem, 7vw, 6.5rem) clamp(1rem, 5vw, 5rem);
          overflow-x: hidden;
          background-color: var(--ink);
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            radial-gradient(circle at 85% 10%, rgba(255, 113, 91, 0.22), transparent 28rem),
            radial-gradient(circle at 5% 90%, rgba(255, 209, 102, 0.1), transparent 24rem);
          background-size: 32px 32px, 32px 32px, auto, auto;
          color: var(--text);
          font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        body::before {
          position: fixed;
          top: 0;
          right: 8vw;
          width: 1px;
          height: 100vh;
          background: linear-gradient(transparent, rgba(255, 113, 91, 0.55), transparent);
          content: "";
          pointer-events: none;
        }

        h1 {
          max-width: 48rem;
          margin: 0 auto 2rem;
          color: var(--text);
          font-family: Georgia, "Times New Roman", serif;
          font-size: clamp(3.2rem, 10vw, 8.5rem);
          font-weight: 400;
          letter-spacing: -0.06em;
          line-height: 0.84;
          text-transform: lowercase;
        }

        h1::after {
          display: block;
          width: 4rem;
          height: 0.35rem;
          margin-top: 1.5rem;
          border-radius: 999px;
          background: var(--accent);
          content: "";
        }

        #container {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(2.25rem, 1fr));
          gap: clamp(0.45rem, 1.5vw, 0.8rem);
          max-width: 48rem;
          margin: 0 auto;
          padding: clamp(1rem, 3vw, 2rem);
          border: 1px solid var(--panel-border);
          border-radius: 1.25rem;
          background: var(--panel);
          box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.3);
          backdrop-filter: blur(14px);
        }

        input[type="checkbox"] {
          width: 100%;
          aspect-ratio: 1;
          margin: 0;
          border: 1px solid rgba(255, 255, 255, 0.24);
          border-radius: 0.65rem;
          background: rgba(255, 255, 255, 0.055);
          cursor: pointer;
          transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
          appearance: none;
        }

        input[type="checkbox"]:hover {
          border-color: var(--accent-light);
          background: rgba(255, 209, 102, 0.16);
          transform: translateY(-2px);
        }

        input[type="checkbox"]:checked {
          border-color: var(--accent);
          background-color: var(--accent);
          background-image: linear-gradient(135deg, var(--accent), #e74867);
          box-shadow: 0 0 1rem rgba(255, 113, 91, 0.32);
        }

        input[type="checkbox"]:checked::after {
          display: block;
          width: 35%;
          height: 60%;
          margin: 16% auto 0;
          border-right: 2px solid var(--ink);
          border-bottom: 2px solid var(--ink);
          content: "";
          transform: rotate(45deg);
        }

        input[type="checkbox"]:focus-visible {
          outline: 3px solid var(--accent-light);
          outline-offset: 3px;
        }

        @media (max-width: 32rem) {
          body {
            padding: 3rem 1rem;
          }

          #container {
            grid-template-columns: repeat(5, 1fr);
            gap: 0.55rem;
          }
        }
    </style>
  </head>
  <body>
    <h1>cheakboxes</h1>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const container = document.getElementById('container')
      const CHECKBOX_COUNT = 100

      new Array(CHECKBOX_COUNT).fill(null).forEach((_, index) => {
        const input = document.createElement('input')
        input.type = 'checkbox'

        input.addEventListener('change', event =>{
            const checked = event.target.checked
            console.log('Checkbox Changed', {index, checked});
            
        })
        container.appendChild(input)

      })
    </script>
  </body>
</html>
